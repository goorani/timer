<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머</title>
<style>
  :root {
    --bg: #f6f5f2; --fg: #1d1d1f; --muted: #8a8a8e; --card: #ffffff;
    --accent: #e8590c; --line: #e3e1dc; --ring-bg: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #f2f2f2; --muted: #8e8e93; --card: #1f1f22;
            --accent: #ff8a3d; --line: #2e2e32; --ring-bg: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .app { width: 100%; max-width: 420px; text-align: center; }
  .tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line);
          border-radius: 999px; padding: 4px; margin-bottom: 28px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px;
                 padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  .tabs button.on { background: var(--fg); color: var(--bg); }
  .ring { position: relative; width: 280px; height: 280px; margin: 0 auto 28px; max-width: 100%; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: var(--ring-bg); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
  .time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: 52px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .time.done { color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .inputs label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  .inputs input { width: 72px; padding: 10px; font: inherit; font-size: 20px; text-align: center;
                  background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; }
  .presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .presets button { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit;
                    font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .controls { display: flex; gap: 12px; justify-content: center; }
  .controls button { font: inherit; font-size: 16px; font-weight: 600; padding: 14px 0; width: 120px;
                     border-radius: 14px; cursor: pointer; border: 1px solid var(--line);
                     background: var(--card); color: var(--fg); }
  .controls .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .laps { list-style: none; padding: 0; margin: 20px auto 0; max-height: 180px; overflow-y: auto;
          font-variant-numeric: tabular-nums; }
  .laps li { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line);
             color: var(--muted); }
  .laps li span:last-child { color: var(--fg); }
  .hidden { display: none !important; }
  .hint { margin-top: 20px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button id="tabTimer" class="on">타이머</button>
    <button id="tabWatch">스톱워치</button>
  </div>

  <div class="ring">
    <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="arc" cx="60" cy="60" r="54"/></svg>
    <div class="time" id="display">05:00</div>
  </div>

  <div id="timerSetup">
    <div class="inputs">
      <label>시<input id="h" type="number" min="0" max="99" value="0"></label>
      <label>분<input id="m" type="number" min="0" max="59" value="5"></label>
      <label>초<input id="s" type="number" min="0" max="59" value="0"></label>
    </div>
    <div class="presets">
      <button data-sec="60">1분</button><button data-sec="180">3분</button>
      <button data-sec="300">5분</button><button data-sec="600">10분</button>
      <button data-sec="1500">25분</button><button data-sec="3600">1시간</button>
    </div>
  </div>

  <div class="controls">
    <button id="start" class="primary">시작</button>
    <button id="reset">초기화</button>
  </div>
  <ul class="laps hidden" id="laps"></ul>
  <div class="hint">스페이스: 시작/일시정지 · R: 초기화</div>
</div>

<script>
const $ = id => document.getElementById(id);
const arc = $('arc'), display = $('display');
const C = 2 * Math.PI * 54;
arc.style.strokeDasharray = C;

let mode = 'timer', running = false, raf = null;
let total = 300000, endAt = 0, remaining = 300000;   // 타이머 (ms)
let watchStart = 0, watchElapsed = 0, lastLap = 0;   // 스톱워치 (ms)

const pad = n => String(n).padStart(2, '0');
function fmt(ms, cs) {
  const t = Math.max(0, ms), h = Math.floor(t / 3600000), m = Math.floor(t / 60000) % 60, s = Math.floor(t / 1000) % 60;
  let out = (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s);
  if (cs) out += '.' + pad(Math.floor(t / 10) % 100);
  return out;
}
function readInputs() {
  const v = id => Math.max(0, parseInt($(id).value) || 0);
  return (v('h') * 3600 + v('m') * 60 + v('s')) * 1000;
}
function setInputs(sec) {
  $('h').value = Math.floor(sec / 3600); $('m').value = Math.floor(sec / 60) % 60; $('s').value = sec % 60;
}

function render() {
  if (mode === 'timer') {
    const left = running ? endAt - Date.now() : remaining;
    display.textContent = fmt(Math.ceil(left / 1000) * 1000);
    arc.style.strokeDashoffset = total ? C * (1 - Math.max(0, left) / total) : C;
  } else {
    const el = running ? watchElapsed + Date.now() - watchStart : watchElapsed;
    display.textContent = fmt(el, true);
    arc.style.strokeDashoffset = C * (1 - (el % 60000) / 60000);
  }
}
function loop() {
  if (mode === 'timer' && running && endAt - Date.now() <= 0) return finish();
  render();
  raf = requestAnimationFrame(loop);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch (e) {}
}
function finish() {
  running = false; remaining = 0; cancelAnimationFrame(raf);
  render(); display.classList.add('done');
  $('start').textContent = '시작'; document.title = '⏰ 완료!';
  beep();
}

function toggle() {
  display.classList.remove('done');
  if (mode === 'timer') {
    if (!running) {
      if (remaining <= 0 || remaining === total) { total = readInputs(); remaining = total; }
      if (total <= 0) return;
      endAt = Date.now() + remaining; running = true;
    } else { remaining = endAt - Date.now(); running = false; }
    $('reset').textContent = '초기화';
  } else {
    if (!running) { watchStart = Date.now(); running = true; $('reset').textContent = '랩'; }
    else { watchElapsed += Date.now() - watchStart; running = false; $('reset').textContent = '초기화'; }
  }
  $('start').textContent = running ? '일시정지' : (mode === 'timer' && remaining < total || mode === 'watch' && watchElapsed ? '계속' : '시작');
  cancelAnimationFrame(raf);
  running ? loop() : render();
}
function reset() {
  if (mode === 'watch' && running) {   // 랩 기록
    const el = watchElapsed + Date.now() - watchStart;
    const li = document.createElement('li');
    li.innerHTML = `<span>랩 ${$('laps').children.length + 1} · +${fmt(el - lastLap, true)}</span><span>${fmt(el, true)}</span>`;
    $('laps').prepend(li); lastLap = el; return;
  }
  running = false; cancelAnimationFrame(raf); display.classList.remove('done'); document.title = '타이머';
  if (mode === 'timer') { total = readInputs(); remaining = total; }
  else { watchElapsed = 0; lastLap = 0; $('laps').innerHTML = ''; }
  $('start').textContent = '시작'; $('reset').textContent = '초기화';
  render();
}
function switchMode(m) {
  if (mode === m) return;
  running = false; cancelAnimationFrame(raf); mode = m;
  $('tabTimer').classList.toggle('on', m === 'timer');
  $('tabWatch').classList.toggle('on', m === 'watch');
  $('timerSetup').classList.toggle('hidden', m !== 'timer');
  $('laps').classList.toggle('hidden', m !== 'watch');
  reset();
}

$('start').onclick = toggle;
$('reset').onclick = reset;
$('tabTimer').onclick = () => switchMode('timer');
$('tabWatch').onclick = () => switchMode('watch');
['h', 'm', 's'].forEach(id => $(id).addEventListener('input', () => { if (!running) reset(); }));
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => { setInputs(+b.dataset.sec); reset(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.key === 'r' || e.key === 'R') { running && mode === 'watch' ? null : reset(); }
});
render();
</script>
</body>
</html>
